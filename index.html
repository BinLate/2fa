<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo mã OTP từ 2FA</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

    :root {
      --color-primary: #1E293B;
      --color-secondary: #334155;
      --color-cta: #22C55E;
      --color-background: #0F172A;
      --color-text: #F8FAFC;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
      --font-heading: 'Open Sans', sans-serif;
      --font-body: 'Open Sans', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-shadow: none;
      box-sizing: border-box;
    }

    html {
      touch-action: manipulation;
      font-family: var(--font-body);
    }

    body,
    button,
    input,
    select,
    textarea,
    dialog {
      font-family: var(--font-body);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 50%, #e8f5e8 100%);
      padding: 12px 16px 28px;
    }

    .container {
      position: relative;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 16px 18px 20px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 8px 16px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 720px;
      width: 100%;
      animation: fadeInUp 0.6s ease-out;
    }

    .toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }

    .icon-btn,
    .theme-toggle,
    .lang-toggle {
      width: 40px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(160, 170, 180, 0.45);
      background: rgba(255, 255, 255, 0.9);
      color: #2c3e50;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(44, 62, 80, 0.12);
      padding: 0;
    }

    .icon-btn:hover,
    .theme-toggle:hover,
    .lang-toggle:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(44, 62, 80, 0.18);
    }

    .lang-toggle {
      width: auto;
      min-width: 64px;
      padding: 0 8px;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .lang-toggle .lang-flag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 16px;
      line-height: 0;
      flex-shrink: 0;
      overflow: visible;
    }

    .lang-toggle .lang-flag svg {
      width: 24px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.18);
    }

    .lang-toggle .lang-flag svg.flag-vn {
      display: inline-block;
    }

    .lang-toggle .lang-flag svg.flag-us {
      display: none;
    }

    .lang-toggle.is-en .lang-flag svg.flag-vn {
      display: none;
    }

    .lang-toggle.is-en .lang-flag svg.flag-us {
      display: inline-block;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      text-align: left;
      align-items: start;
    }

    .panel {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(200, 210, 220, 0.45);
      border-radius: 14px;
      padding: 14px;
    }

    @media (min-width: 1100px) and (min-height: 900px) {
      .container {
        max-width: 1100px;
      }

      .layout {
        grid-template-columns: 1fr 1fr;
        align-items: stretch;
      }

      .panel {
        height: 100%;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      font-family: var(--font-heading);
      color: #2c3e50;
      font-weight: 600;
      font-size: 22px;
      margin-bottom: 10px;
      padding-right: 168px;
      letter-spacing: -0.5px;
      text-align: left;
    }

    h3 {
      font-family: var(--font-heading);
      color: #2c3e50;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .name-save-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      flex-wrap: nowrap;
    }

    .name-save-row #account-name {
      flex: 1;
      min-width: 0;
    }

    input {
      padding: 10px 14px;
      font-size: 16px;
      border: 2px solid #e1e8ed;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
      font-family: inherit;
      min-width: 0;
      outline: none;
      box-shadow: none;
    }

    input:focus {
      border-color: #81c784;
      box-shadow: 0 0 0 4px rgba(129, 199, 132, 0.1);
      background: rgba(255, 255, 255, 1);
    }

    #secret {
      width: 100%;
    }

    button {
      padding: 12px 18px;
      background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(129, 199, 132, 0.3);
    }

    .action-btn {
      min-width: 110px;
      height: 44px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .generate-row {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 0;
      width: 100%;
    }

    .generate-row .action-btn {
      flex: 1;
      width: auto;
    }

    .list-manager {
      margin: 0 0 10px;
      display: grid;
      gap: 8px;
    }

    select {
      padding: 10px 14px;
      font-size: 15px;
      border: 2px solid #e1e8ed;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.8);
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    .danger-btn {
      background: linear-gradient(135deg, #ef9a9a 0%, #e57373 100%);
      box-shadow: 0 4px 12px rgba(229, 115, 115, 0.3);
    }

    .search-input {
      min-width: auto;
      width: 100%;
      margin-bottom: 14px;
      padding-right: 46px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-wrap .search-input {
      margin-bottom: 0;
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 0;
      border: none;
      background: transparent;
      color: #d32f2f;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: none;
    }

    .clear-search-btn.hidden {
      display: none;
    }

    .clear-search-btn:hover {
      transform: translateY(-50%) scale(1.08);
      box-shadow: none;
    }

    .clear-search-btn:active {
      transform: translateY(-50%) scale(1);
    }

    body.theme-dark .clear-search-btn {
      color: #ef9a9a;
      box-shadow: none;
    }

    .clear-search-btn i {
      pointer-events: none;
      filter: drop-shadow(0 0 3px rgba(211, 47, 47, 0.35));
      transition: filter 0.2s ease;
    }

    .action-btn i {
      font-size: 14px;
      line-height: 1;
      pointer-events: none;
    }

    .clear-search-btn:hover i {
      filter: drop-shadow(0 0 5px rgba(211, 47, 47, 0.5));
    }

    body.theme-dark .clear-search-btn i {
      filter: drop-shadow(0 0 4px rgba(239, 154, 154, 0.45));
    }

    body.theme-dark .clear-search-btn:hover i {
      filter: drop-shadow(0 0 6px rgba(239, 154, 154, 0.65));
    }

    .saved-list {
      display: grid;
      gap: 10px;
      max-height: 420px;
      overflow: auto;
      padding-right: 6px;
    }

    .saved-item {
      border: 1px solid #dfe8ef;
      border-radius: 14px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .saved-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .saved-item-name {
      font-weight: 600;
      color: #2c3e50;
      word-break: break-word;
    }

    .saved-item-secret {
      color: #607080;
      font-size: 13px;
      letter-spacing: 1px;
      font-family: Consolas, monospace;
    }

    .saved-item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .saved-item-actions button {
      padding: 10px 12px;
      font-size: 13px;
      border-radius: 10px;
      min-height: 40px;
    }

    .empty-list {
      color: #7a8a9a;
      text-align: center;
      padding: 16px;
      font-size: 14px;
      border: 1px dashed #ccd8e4;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.75);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(129, 199, 132, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .copy-link-btn {
      background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
      box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
    }

    .copy-link-btn:hover {
      box-shadow: 0 8px 20px rgba(30, 136, 229, 0.4);
    }

    .otp-result {
      margin: 10px 0 8px;
      display: grid;
      gap: 4px;
    }

    .otp-card {
      position: relative;
      cursor: pointer;
    }

    .otp-digits-wrap {
      position: relative;
    }

    .otp-copy-hint {
      display: block;
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 600;
      color: #166534;
      text-align: center;
      user-select: none;
      padding: 8px 0 0;
      background: none;
      border: none;
      box-shadow: none;
      animation: none;
    }

    .otp-copy-hint.is-copied {
      color: #14532d;
    }

    .otp-copy-hint i {
      color: var(--color-cta);
      font-size: 16px;
      margin-right: 4px;
    }

    #otp {
      font-family: var(--font-heading);
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 700;
      margin: 0;
      color: var(--color-primary);
      cursor: pointer;
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.12) 0%, rgba(34, 197, 94, 0.06) 100%);
      padding: 12px 48px 12px 12px;
      min-height: 72px;
      border-radius: 14px;
      border: 2px solid rgba(34, 197, 94, 0.35);
      transition: all 200ms ease;
      letter-spacing: 0.18em;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 8px 20px rgba(34, 197, 94, 0.12);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #otp:hover,
    #otp:focus-visible,
    .otp-card:hover #otp {
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0.1) 100%);
      border-color: rgba(34, 197, 94, 0.55);
      outline: none;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18), 0 10px 24px rgba(34, 197, 94, 0.18);
    }

    #otp.is-copied {
      border-color: var(--color-cta);
      color: #15803d;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.35), 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    .otp-copy-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      min-width: 40px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: #15803d;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.2);
    }

    .otp-copy-btn:hover {
      transform: translateY(-50%);
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .countdown-wrap {
      margin-top: 6px;
    }

    #countdown {
      margin-top: 0;
      font-size: 14px;
      color: #5a6c7d;
      text-align: center;
      font-weight: 500;
    }

    .otp-progress {
      height: 4px;
      margin-top: 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .otp-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--color-cta);
      border-radius: 999px;
      transition: width 200ms linear;
    }

    .next-otp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      min-height: 44px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .next-otp-row.is-hidden {
      display: none;
    }

    .next-otp-label {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      flex-shrink: 0;
    }

    #otp-next {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #334155;
      min-width: 0;
      text-align: right;
    }

    .next-otp-row.is-near-expiry {
      border-color: rgba(245, 158, 11, 0.55);
      background: rgba(254, 243, 199, 0.7);
    }

    .next-otp-row.is-near-expiry .next-otp-label,
    .next-otp-row.is-near-expiry #otp-next {
      color: #b45309;
    }

    .near-expiry-hint {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #b45309;
      text-align: center;
      line-height: 1.35;
    }

    .near-expiry-hint.is-hidden {
      display: none;
    }

    .storage-note a {
      color: #1d4ed8;
      font-weight: 700;
      word-break: break-all;
    }

    @media (prefers-reduced-motion: reduce) {
      .container {
        animation: none;
      }

      #otp,
      #otp:hover,
      #otp:focus-visible,
      .otp-card:hover #otp {
        transition: none;
        transform: none;
      }

      .otp-progress-bar {
        transition: none;
      }
    }

    #global-message {
      color: #e57373;
      margin-top: 0;
      margin-bottom: 10px;
      max-width: 100%;
      word-wrap: break-word;
      background: rgba(229, 115, 115, 0.1);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(229, 115, 115, 0.2);
      display: block;
      font-weight: 700;
      font-size: 14px;
    }

    #global-message.success {
      color: #2e7d32;
      background: rgba(76, 175, 80, 0.12);
      border-color: rgba(76, 175, 80, 0.35);
    }

    #global-message.info {
      color: #b45309;
      background: rgba(255, 193, 7, 0.12);
      border-color: rgba(255, 193, 7, 0.35);
    }

    #global-message:empty {
      display: none;
    }

    .storage-note {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 193, 7, 0.35);
      background: rgba(255, 248, 225, 0.9);
      color: #7a5b00;
      line-height: 1.5;
      font-size: 15px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      z-index: 40;
      max-width: min(92vw, 420px);
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.94);
      color: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .help-dialog {
      border: none;
      border-radius: 16px;
      padding: 0;
      max-width: min(92vw, 480px);
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .help-dialog::backdrop {
      background: rgba(15, 23, 42, 0.45);
    }

    .help-dialog .help-head,
    .help-dialog .help-body,
    .help-dialog .help-foot {
      padding: 14px 18px;
    }

    .help-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
    }

    .help-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .help-body ol {
      padding-left: 18px;
      display: grid;
      gap: 8px;
      color: #334155;
      font-size: 14px;
      line-height: 1.45;
    }

    .help-body code {
      font-size: 12px;
      background: rgba(15, 23, 42, 0.06);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .help-foot {
      display: flex;
      justify-content: flex-end;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      min-width: 36px;
      padding: 0;
      background: transparent;
      color: #334155;
      box-shadow: none;
      font-size: 22px;
    }

    .modal-close:hover {
      transform: none;
      box-shadow: none;
      background: rgba(15, 23, 42, 0.06);
    }

    @media (max-width: 600px) {
      .container {
        padding: 14px 12px 16px;
        margin: 0;
      }

      .toolbar {
        top: 10px;
        right: 10px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .name-save-row,
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }

      input {
        min-width: auto;
        width: 100%;
      }

      .panel-generator .action-btn {
        width: 100%;
        max-width: 100%;
        min-height: 44px;
      }

      .generate-row {
        width: 100%;
        justify-content: stretch;
      }

      .generate-row .action-btn {
        flex: 1;
        min-height: 44px;
      }

      #otp {
        min-height: 72px;
        padding: 12px 44px 12px 10px;
        letter-spacing: 0.14em;
        font-size: clamp(28px, 9vw, 38px);
      }

      .otp-copy-hint {
        font-size: 16px;
      }

      .saved-item-actions {
        justify-content: stretch;
      }

      .saved-item-actions button {
        width: auto;
        flex: 1;
        min-width: 0;
      }
    }

    @media (max-height: 700px) {
      body {
        padding: 8px 12px 16px;
      }

      .container {
        padding: 12px 14px 14px;
      }

      h2 {
        font-size: 20px;
        margin-bottom: 8px;
      }

      .panel {
        padding: 12px;
      }

      #otp {
        min-height: 64px;
        padding: 10px 44px 10px 10px;
      }

      .storage-note {
        font-size: 14px;
        padding: 8px 10px;
      }
    }

    body.theme-dark {
      background: linear-gradient(135deg, #0f172a 0%, #1f2937 50%, #111827 100%);
      color: #e5e7eb;
    }

    body.theme-dark .container {
      background: rgba(17, 24, 39, 0.88);
      border-color: rgba(75, 85, 99, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45), 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    body.theme-dark .panel {
      background: rgba(15, 23, 42, 0.65);
      border-color: rgba(71, 85, 105, 0.45);
    }

    body.theme-dark h2,
    body.theme-dark h3,
    body.theme-dark .saved-item-name,
    body.theme-dark #countdown {
      color: #e5e7eb;
    }

    body.theme-dark input,
    body.theme-dark select {
      background: rgba(31, 41, 55, 0.9);
      border-color: #4b5563;
      color: #e5e7eb;
    }

    body.theme-dark .saved-item {
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(71, 85, 105, 0.45);
    }

  <script>
    var TOTP_PERIOD = 30;
    var TOTP_DIGITS = 6;
    var NEAR_EXPIRY_SECONDS = 5;

    function getNowMs() {
      if (typeof window !== 'undefined' && typeof window.__TWOFA_NOW__ === 'number') {
        return window.__TWOFA_NOW__;
      }
      return Date.now();
    }

    function getEpochSec() {
      return Math.floor(getNowMs() / 1000);
    }

    // Nhúng otplib trực tiếp (rút gọn từ @otplib/core và @otplib/preset-browser v12.0.1)
    (function () {
      window.otplib = window.otplib || {};
      const BASE32_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      function base32Decode(str) {
        str = str.toUpperCase().replace(/[^A-Z2-7]/g, '');
        let bits = '';
        for (let i = 0; i < str.length; i++) {
          let val = BASE32_ALPHABET.indexOf(str[i]);
          if (val === -1) throw new Error('Invalid Base32 character');
          bits += val.toString(2).padStart(5, '0');
        }
        let bytes = [];
        for (let i = 0; i < bits.length - 7; i += 8) {
          bytes.push(parseInt(bits.slice(i, i + 8), 2));
        }
        return new Uint8Array(bytes);
      }
      function hmacSha1(key, message) {
        const crypto = window.crypto || window.msCrypto;
        if (!crypto || !crypto.subtle) throw new Error('Web Crypto API not supported');
        return crypto.subtle.importKey(
          'raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']
        ).then(key => crypto.subtle.sign('HMAC', key, message));
      }
      function uintToBuf(num) {
        let buf = new ArrayBuffer(8);
        let view = new DataView(buf);
        view.setBigUint64(0, BigInt(num));
        return new Uint8Array(buf);
      }
      otplib.authenticator = {
        generateAtCounter: function (secret, counter) {
          const key = base32Decode(secret);
          const msg = uintToBuf(counter);
          const mod = Math.pow(10, TOTP_DIGITS);
          return hmacSha1(key, msg).then(function (sig) {
            const buffer = new Uint8Array(sig);
            const offset = buffer[buffer.length - 1] & 0x0f;
            const bin = (
              ((buffer[offset] & 0x7f) << 24) |
              ((buffer[offset + 1] & 0xff) << 16) |
              ((buffer[offset + 2] & 0xff) << 8) |
              (buffer[offset + 3] & 0xff)
            );
            const code = (bin >>> 0) % mod;
            return code.toString().padStart(TOTP_DIGITS, '0');
          });
        },
        generate: function (secret) {
          const counter = Math.floor(getEpochSec() / TOTP_PERIOD);
          return otplib.authenticator.generateAtCounter(secret, counter);
        }
      };
    })();

    function generateWindow(secret) {
      const epoch = getEpochSec();
      const slot = Math.floor(epoch / TOTP_PERIOD);
      const remaining = TOTP_PERIOD - (epoch % TOTP_PERIOD);
      return Promise.all([
        otplib.authenticator.generateAtCounter(secret, slot),
        otplib.authenticator.generateAtCounter(secret, slot + 1)
      ]).then(function (pair) {
        return { current: pair[0], next: pair[1], slot: slot, remaining: remaining };
      });
    }

    function cleanSecret(secret) {
      return String(secret || '').replace(/[\s-]+/g, '').toUpperCase();
    }

    function stripWhitespace(text) {
      return (text || '').replace(/\s+/g, '');
    }

    function sanitizeSecretInput(text) {
      return stripWhitespace(text).toUpperCase().replace(/[^A-Z2-7]/g, '');
    }

    function normalizeBase32Candidate(text) {
      return String(text || '').toUpperCase().replace(/[\s-]+/g, '').replace(/[^A-Z2-7]/g, '');
    }

    function isValidBase32(secret) {
      return /^[A-Z2-7]+$/.test(secret || '');
    }

    function hasDelimiters(text) {
      return /[|,\t]/.test(text || '');
    }

    function isMixedOrUri(text) {
      const value = String(text || '');
      return hasDelimiters(value) || /^otpauth:\/\//i.test(value.trim());
    }

    function looksLikeEmail(text) {
      return /@/.test(String(text || '').trim());
    }

    function looksLikeHttpUrl(text) {
      const value = String(text || '').trim();
      if (!value || /^otpauth:\/\//i.test(value)) return false;
      return /^(https?:\/\/|\/\/|www\.)/i.test(value) || /\bhttps?:\/\//i.test(value);
    }

    function isBase32Token(text) {
      return /^[A-Za-z2-7]+$/.test(String(text || '')) && String(text).length >= 2;
    }

    function cleanBase32(text) {
      const cleaned = String(text || '').toUpperCase().replace(/[\s-=]+/g, '');
      return /^[A-Z2-7]+$/.test(cleaned) ? cleaned : '';
    }

    function groupedBase32(text, minLen) {
      const min = minLen || 16;
      const tokens = String(text || '').trim().split(/\s+/).filter(Boolean);
      let best = '';
      let run = [];

      function flush() {
        const joined = run.join('').toUpperCase();
        if (joined.length >= min && joined.length > best.length) best = joined;
        run = [];
      }

      for (let i = 0; i < tokens.length; i++) {
        const token = tokens[i];
        if (token.indexOf('-') !== -1) {
          const bits = token.split('-').filter(Boolean);
          if (bits.length > 1 && bits.every(isBase32Token)) {
            run.push(bits.join(''));
            continue;
          }
        }
        if (isBase32Token(token)) {
          run.push(token);
        } else {
          flush();
        }
      }
      flush();
      return best;
    }

    function secretFromPart(part, minLen) {
      const raw = String(part || '').trim();
      if (!raw || looksLikeHttpUrl(raw)) return '';
      const grouped = groupedBase32(raw, minLen);
      if (grouped) return grouped;
      const clean = cleanBase32(raw);
      return clean.length >= minLen ? clean : '';
    }

    function extractTotpSecret(raw) {
      const trimmed = String(raw || '').trim();
      if (!trimmed) return { error: 'empty' };

      if (/^otpauth:\/\//i.test(trimmed)) {
        try {
          const url = new URL(trimmed);
          if (url.protocol !== 'otpauth:') return { error: 'invalid' };
          const secret = normalizeBase32Candidate(url.searchParams.get('secret') || '');
          if (!isValidBase32(secret) || secret.length < 8) return { error: 'invalid' };
          const path = decodeURIComponent((url.pathname || '').replace(/^\//, ''));
          let label = path;
          if (path.indexOf(':') !== -1) {
            const bits = path.split(':');
            bits.shift();
            label = bits.join(':').trim();
          }
          const issuer = url.searchParams.get('issuer') || '';
          return { secret: secret, label: label || issuer || null };
        } catch (e) {
          return { error: 'invalid' };
        }
      }

      let parts;
      if (trimmed.indexOf('|') !== -1) {
        parts = trimmed.split(/\s*\|\s*/);
      } else if (/\t/.test(trimmed)) {
        parts = trimmed.split(/\t+/);
      } else if (trimmed.indexOf(',') !== -1) {
        parts = trimmed.split(/\s*,\s*/);
      } else {
        if (looksLikeHttpUrl(trimmed)) return { error: 'invalid' };
        const grouped = groupedBase32(trimmed, 16);
        if (grouped) return { secret: grouped, label: null };
        const only = cleanBase32(trimmed);
        if (only.length >= 8) return { secret: only, label: null };
        return { error: 'invalid' };
      }

      const parsedParts = parts.map(function (part) {
        return { raw: String(part || '').trim() };
      });

      let chosenSecret = '';
      let chosenIndex = -1;
      const last = parsedParts[parsedParts.length - 1];
      const lastSecret = last ? secretFromPart(last.raw, 8) : '';
      if (lastSecret) {
        chosenSecret = lastSecret;
        chosenIndex = parsedParts.length - 1;
      } else {
        for (let i = parsedParts.length - 1; i >= 0; i--) {
          const candidate = secretFromPart(parsedParts[i].raw, 16);
          if (candidate) {
            chosenSecret = candidate;
            chosenIndex = i;
            break;
          }
        }
      }
      if (!chosenSecret) return { error: 'invalid' };

      let label = null;
      const firstRaw = parsedParts[0] && parsedParts[0].raw;
      if (firstRaw && looksLikeEmail(firstRaw) && chosenIndex !== 0) {
        label = firstRaw;
      }
      return { secret: chosenSecret, label: label };
    }

    function applyExtractedSecret(result) {
      if (!result || result.error || !result.secret) return false;
      const secretInput = document.getElementById('secret');
      const nameInput = document.getElementById('account-name');
      if (secretInput) secretInput.value = result.secret;
      if (nameInput && result.label && !String(nameInput.value || '').trim()) {
        nameInput.value = result.label;
      }
      return true;
    }

    function flashOtpCopiedFeedback() {
      const otpEl = document.getElementById('otp');
      const hintEl = document.getElementById('otp-copy-hint');
      const hintText = hintEl ? hintEl.querySelector('span') : null;

      if (otpEl) otpEl.classList.add('is-copied');
      if (hintEl) hintEl.classList.add('is-copied');
      if (hintText) hintText.textContent = t('copiedHint');

      if (navigator.vibrate) {
        try { navigator.vibrate(12); } catch (e) { /* ignore */ }
      }

      clearTimeout(flashOtpCopiedFeedback._timer);
      flashOtpCopiedFeedback._timer = setTimeout(function () {
        if (otpEl) otpEl.classList.remove('is-copied');
        if (hintEl) hintEl.classList.remove('is-copied');
        if (hintText) hintText.textContent = t('clickToCopy');
      }, 2800);
    }

    function copyPlainText(text, onOk, onFail) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onOk).catch(function () {
          try {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            onOk();
          } catch (e) {
            onFail();
          }
        });
      } else {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          onOk();
        } catch (e) {
          onFail();
        }
      }
    }

    function copyOTP() {
      const otpValue = getOtpValue();
      if (!otpValue) return;

      const seconds = getTimeRemaining();
      const message = seconds <= NEAR_EXPIRY_SECONDS
        ? (t('toast.copyCurrent', { otp: otpValue }) + t('toast.nearExpiry'))
        : t('toast.copyCurrent', { otp: otpValue });

      copyPlainText(otpValue, function () {
        showToast(message);
        flashOtpCopiedFeedback();
      }, function () {
        setErrorMessage(t('error.clipboard'));
      });
    }

    function copyNextOtp() {
      const otpValue = getNextOtpValue();
      if (!otpValue) return;

      copyPlainText(otpValue, function () {
        showToast(t('toast.copyNext', { otp: otpValue }));
        const row = document.getElementById('next-otp-row');
        if (row) row.classList.add('is-copied');
        clearTimeout(copyNextOtp._timer);
        copyNextOtp._timer = setTimeout(function () {
          if (row) row.classList.remove('is-copied');

      }, function () {
        setErrorMessage(t('error.clipboard'));
      });
    }

    function copyCurrentLink() {
      const secretInputEl = document.getElementById('secret');
      const extracted = extractTotpSecret(secretInputEl ? secretInputEl.value : '');
      const normalizedSecret = (extracted && extracted.secret) ? extracted.secret : sanitizeSecretInput(secretInputEl ? secretInputEl.value : '');
      if (!normalizedSecret || !isValidBase32(normalizedSecret)) {
        setErrorMessage(t('error.copyLinkNeedSecret'));
        return;
      }

      if (secretInputEl) secretInputEl.value = normalizedSecret;

      const linkToCopy = 'https://2fa.muabanquyen.com/' + normalizedSecret;
      copyPlainText(linkToCopy, function () {
        showToast(t('toast.copyLink'));
      }, function () {
        setErrorMessage(t('error.copyLinkFail'));
      });
    }

    let countdownInterval = null;
    let currentSecret = '';
    let lastOtpTime = 0;
    const STORAGE_KEY = 'twofa.savedSecrets.v1';
    const THEME_KEY = 'twofa.theme.v1';
    let savedSecrets = [];
    let hasManualThemeChoice = false;

    function applyThemeTitles() {
      const toggle = document.getElementById('theme-toggle');
      if (!toggle) return;
      const isDark = document.body.classList.contains('theme-dark');
      const key = isDark ? 'a11y.themeToLight' : 'a11y.themeToDark';
      toggle.title = t(key);
      toggle.setAttribute('aria-label', t(key));
    }

    function applyTheme(theme) {
      const body = document.body;
      const toggle = document.getElementById('theme-toggle');
      const isDark = theme === 'dark';
      body.classList.toggle('theme-dark', isDark);
      if (toggle) {
        toggle.textContent = isDark ? '☀️' : '🌙';
      }
      applyThemeTitles();
    }

    function detectSystemTheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || saved === 'light') {
        hasManualThemeChoice = true;
        applyTheme(saved);
      } else {
        applyTheme(detectSystemTheme());
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('theme-dark');
      const nextTheme = isDark ? 'light' : 'dark';
      hasManualThemeChoice = true;
      localStorage.setItem(THEME_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    function loadSavedSecretsFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        if (Array.isArray(parsed)) {
          savedSecrets = parsed.filter(function (item) { return item && item.secret && item.name; });
        } else {
          savedSecrets = [];
        }
      } catch (error) {
        savedSecrets = [];
      }
      renderSavedSecrets();
    }

    function persistSavedSecrets() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedSecrets));
      } catch (error) {
        setErrorMessage(t('error.saveStorage'));
      }
    }

    function touchLastUsed(id) {
      const item = savedSecrets.find(function (entry) { return entry.id === id; });
      if (!item) return;
      item.lastUsedAt = Date.now();
    }

    function renderSavedSecrets() {
      const listContainer = document.getElementById('saved-list');
      if (!listContainer) return;
      const searchInput = document.getElementById('search-saved');
      const search = ((searchInput && searchInput.value) || '').trim().toLowerCase();
      updateClearSearchButtonVisibility();

      const filtered = savedSecrets.filter(function (item) {
        return item.name.toLowerCase().includes(search);
      });
      listContainer.innerHTML = '';

      if (!filtered.length) {
        const emptyMessage = savedSecrets.length === 0 ? t('empty.none') : t('empty.noMatch');
        listContainer.innerHTML = '<div class="empty-list">' + emptyMessage + '</div>';
        return;
      }

      filtered.forEach(function (item) {
        const card = document.createElement('div');
        card.className = 'saved-item';
        const maskedSecret = item.secret.slice(0, 4) + ' •••• ••••';
        const safeId = escapeHtml(item.id);
        card.innerHTML =
          '<div class="saved-item-header">' +
            '<div class="saved-item-name">' + escapeHtml(item.name) + '</div>' +
          '</div>' +
          '<div class="saved-item-secret">' + escapeHtml(maskedSecret) + '</div>' +
          '<div class="saved-item-actions">' +
            '<button type="button" onclick="generateFromSaved(\'' + safeId + '\')">' + escapeHtml(t('btn.otp')) + '</button>' +
            '<button type="button" onclick="useSavedSecret(\'' + safeId + '\')">' + escapeHtml(t('btn.use')) + '</button>' +
            '<button type="button" class="danger-btn" onclick="deleteSecretById(\'' + safeId + '\')">' + escapeHtml(t('btn.delete')) + '</button>' +
          '</div>';
        listContainer.appendChild(card);
      });
    }

    function updateClearSearchButtonVisibility() {
      const searchInput = document.getElementById('search-saved');
      const clearBtn = document.getElementById('clear-search-btn');
      if (!searchInput || !clearBtn) return;
      clearBtn.classList.toggle('hidden', !searchInput.value.trim());
    }

    function clearSavedSearch() {
      const searchInput = document.getElementById('search-saved');
      if (!searchInput) return;
      searchInput.value = '';
      renderSavedSecrets();
      searchInput.focus();
    }

    function saveCurrentSecret() {
      const accountNameInput = document.getElementById('account-name');
      const secretInput = document.getElementById('secret');
      const extracted = extractTotpSecret(secretInput ? secretInput.value : '');
      if (extracted && extracted.secret) applyExtractedSecret(extracted);
      const cleanSecretInput = (extracted && extracted.secret) ? extracted.secret : cleanSecret(secretInput ? secretInput.value : '');
      const accountName = ((accountNameInput && accountNameInput.value) || '').trim();

      clearMessage();
      if (!accountName) {
        setErrorMessage(t('error.saveName'));
        return;
      }
      if (!cleanSecretInput || !isValidBase32(cleanSecretInput) || cleanSecretInput.length < 8) {
        setErrorMessage(t('error.saveSecret'));
        return;
      }

      const nameExists = savedSecrets.some(function (item) {
        return item.name.toLowerCase() === accountName.toLowerCase();
      });
      if (nameExists) {
        setErrorMessage(t('error.saveDuplicate'));
        return;
      }

      savedSecrets.push({
        id: Date.now().toString(36),
        name: accountName,
        secret: cleanSecretInput,
        lastUsedAt: Date.now()
      });

      persistSavedSecrets();
      renderSavedSecrets();
      showToast(t('toast.saved'));
    }

    function useSavedSecret(id) {
      const selected = savedSecrets.find(function (item) { return item.id === id; });
      if (!selected) return;
      document.getElementById('secret').value = selected.secret;
      document.getElementById('account-name').value = selected.name;
      touchLastUsed(id);
      persistSavedSecrets();
      handleSecretInput();
    }

    function generateFromSaved(id) {
      const selected = savedSecrets.find(function (item) { return item.id === id; });
      if (!selected) return;
      document.getElementById('secret').value = selected.secret;
      document.getElementById('account-name').value = selected.name;
      touchLastUsed(id);
      persistSavedSecrets();
      renderSavedSecrets();
      generateOTP({ copyAfter: true });
    }

    function deleteSecretById(id) {
      const selected = savedSecrets.find(function (item) { return item.id === id; });
      if (!selected) return;
      if (!window.confirm(t('confirm.delete', { name: selected.name }))) return;

      savedSecrets = savedSecrets.filter(function (item) { return item.id !== id; });
      persistSavedSecrets();
      renderSavedSecrets();
      showToast(t('toast.deleted'));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getTimeRemaining() {
      return TOTP_PERIOD - (getEpochSec() % TOTP_PERIOD);
    }

    function getCurrentTimeSlot() {
      return Math.floor(getEpochSec() / TOTP_PERIOD);
    }

    function refreshCountdownLabel() {
      const countdownDisplay = document.getElementById('countdown');
      if (!countdownDisplay || !currentSecret) return;
      countdownDisplay.textContent = t('countdown', { seconds: getTimeRemaining() });
    }

    function updateNearExpiryUi(seconds) {
      const row = document.getElementById('next-otp-row');
      const hint = document.getElementById('near-expiry-hint');
      const near = !!currentSecret && seconds > 0 && seconds <= NEAR_EXPIRY_SECONDS;
      if (row) row.classList.toggle('is-near-expiry', near);
      if (hint) hint.classList.toggle('is-hidden', !near);
    }

    function resetCountdownUi() {
      const countdownDisplay = document.getElementById('countdown');
      const progressBar = document.getElementById('otp-progress-bar');
      if (countdownDisplay) countdownDisplay.textContent = '';
      if (progressBar) progressBar.style.width = '0%';
      setNextOtpValue('');
      updateNearExpiryUi(0);
    }

    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);
      const countdownDisplay = document.getElementById('countdown');
      const progressBar = document.getElementById('otp-progress-bar');

      function updateCountdown() {
        const seconds = getTimeRemaining();
        const currentTimeSlot = getCurrentTimeSlot();
        if (countdownDisplay) countdownDisplay.textContent = t('countdown', { seconds: seconds });
        if (progressBar) progressBar.style.width = ((seconds / TOTP_PERIOD) * 100) + '%';
        updateNearExpiryUi(seconds);

        if (currentTimeSlot !== lastOtpTime && currentSecret) {
          lastOtpTime = currentTimeSlot;
          generateWindow(currentSecret).then(function (win) {
            applyOtpWindow(win);
          }).catch(function (error) {
            setErrorMessage(t('error.generate', { error: error.message }));
            clearInterval(countdownInterval);
          });
        }
      }

      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
    }

    function generateOTP(options) {
      options = options || {};
      const secretInputEl = document.getElementById('secret');
      const extracted = extractTotpSecret(secretInputEl ? secretInputEl.value : '');
      if (extracted && extracted.secret) {
        applyExtractedSecret(extracted);
      } else if (secretInputEl && isMixedOrUri(secretInputEl.value)) {
        setOtpValue('');
        resetCountdownUi();
        if (countdownInterval) clearInterval(countdownInterval);
        currentSecret = '';
        lastOtpTime = 0;
        setErrorMessage(t('error.extract'));
        return;
      }

      const cleanSecretInput = (extracted && extracted.secret)
        ? extracted.secret
        : cleanSecret(secretInputEl ? secretInputEl.value : '');

      if (!options.keepMessage) clearMessage();
      setOtpValue('');
      resetCountdownUi();

      if (!cleanSecretInput) {
        setErrorMessage(t('error.emptySecret'));
        if (countdownInterval) clearInterval(countdownInterval);
        return;
      }

      if (!isValidBase32(cleanSecretInput) || cleanSecretInput.length < 8) {
        setErrorMessage(t('error.invalidBase32'));
        if (countdownInterval) clearInterval(countdownInterval);
        return;
      }

      if (!otplib.authenticator || typeof otplib.authenticator.generateAtCounter !== 'function') {
        setErrorMessage(t('error.otplib'));
        if (countdownInterval) clearInterval(countdownInterval);
        return;
      }

      currentSecret = cleanSecretInput;
      lastOtpTime = getCurrentTimeSlot();
      generateWindow(currentSecret).then(function (win) {
        applyOtpWindow(win);
        startCountdown();
        if (options.copyAfter) copyOTP();
      }).catch(function (error) {
        setErrorMessage(t('error.generate', { error: error.message }));
        if (countdownInterval) clearInterval(countdownInterval);
      });
    }

    async function readClipboardTextSafely() {
      if (!(navigator.clipboard && navigator.clipboard.readText)) {
        throw new Error('Clipboard API not supported');
      }
      return await navigator.clipboard.readText();
    }

    async function getClipboardReadPermissionState() {
      try {
        if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
        const result = await navigator.permissions.query({ name: 'clipboard-read' });
        return result && result.state ? result.state : 'unknown';
      } catch (_) {
        return 'unknown';
      }
    }

    async function autoPasteOnLoad() {
      const permissionState = await getClipboardReadPermissionState();
      if (permissionState === 'denied') return;
      try {
        const text = await readClipboardTextSafely();
        applyClipboardTextToSecret(text, 'Đã nhận secret từ clipboard.');
      } catch (_) {
        // Silent on load: many browsers block clipboard read before user gesture.
      }
    }

    function applyClipboardTextToSecret(text) {
      const extracted = extractTotpSecret(text);
      if (extracted && extracted.secret) {
        applyExtractedSecret(extracted);
        generateOTP({ keepMessage: true });
        showToast(t('toast.pasted'));
        return true;
      }
      if (isMixedOrUri(text)) {
        setErrorMessage(t('error.extract'));
        return 'invalid';
      }
      return false;
    }

    function parseSecretFromUrl() {
      if (typeof location !== 'undefined' && location.protocol === 'file:') return false;

      let hashRaw = '';
      try {
        const hash = decodeURIComponent(window.location.hash || '');
        const match = hash.match(/^#s=([^&]+)/i);
        if (match) hashRaw = match[1];
      } catch (e) { /* ignore */ }

      let path = '';
      try {
        path = decodeURIComponent(window.location.pathname || '');
      } catch (e) { /* ignore */ }
      if (path.startsWith('/')) path = path.substring(1);
      if (/\.html?$/i.test(path) || path.indexOf(':') !== -1 || path.indexOf('\\') !== -1 || path.indexOf('/') !== -1) {
        path = '';
      }

      const hashExtracted = hashRaw ? extractTotpSecret(hashRaw) : null;
      const pathExtracted = path ? extractTotpSecret(path) : null;
      const extracted = (hashExtracted && hashExtracted.secret)
        ? hashExtracted
        : ((pathExtracted && pathExtracted.secret) ? pathExtracted : null);
      if (!extracted || !extracted.secret) return false;

      applyExtractedSecret(extracted);
      generateOTP({ keepMessage: true });

      try {
        history.replaceState(null, '', '/' + extracted.secret);
      } catch (e) { /* ignore */ }
      showToast(t('toast.fromLink'));
      return true;
    }

    function openHelp() {
      const dialog = document.getElementById('help-dialog');
      if (!dialog) return;
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    }

    function closeHelp() {
      const dialog = document.getElementById('help-dialog');
      if (!dialog) return;
      if (typeof dialog.close === 'function' && dialog.open) dialog.close();
      else dialog.removeAttribute('open');
    }

    function setupHelpDialog() {
      const dialog = document.getElementById('help-dialog');
      if (!dialog) return;
      dialog.addEventListener('click', function (event) {
        if (event.target === dialog) closeHelp();
      });
    }

    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeHelp();
          return;
        }
        if (event.key === 'Enter' && event.target && event.target.id === 'secret') {
          if (event.isComposing || event.keyCode === 229) return;
          event.preventDefault();
          generateOTP();
          return;
        }
        if ((event.ctrlKey || event.metaKey) && (event.key === 'c' || event.key === 'C')) {
          const otpEl = document.getElementById('otp');
          const nextEl = document.getElementById('otp-next');
          const nextRow = document.getElementById('next-otp-row');
          const card = document.getElementById('otp-card');
          const active = document.activeElement;
          if (active === nextEl || active === nextRow || (nextRow && nextRow.contains(active))) {
            event.preventDefault();
            copyNextOtp();
            return;
          }
          if (active === otpEl || (card && card.contains(active))) {
            event.preventDefault();
            copyOTP();
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      initLanguage();
      initTheme();
      setupSecretPasteHandler();
      setupHelpDialog();
      setupKeyboardShortcuts();
      loadSavedSecretsFromStorage();
      if (parseSecretFromUrl()) return;
      setTimeout(autoPasteOnLoad, 500);
    });

    if (window.matchMedia) {
      const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
      systemThemeMedia.addEventListener('change', function () {
        if (!hasManualThemeChoice) {
          applyTheme(systemThemeMedia.matches ? 'dark' : 'light');
        }
      });
    }

    function setupSecretPasteHandler() {
      const secretInput = document.getElementById('secret');
      if (!secretInput) return;
      secretInput.addEventListener('paste', function (event) {
        const text = event.clipboardData ? event.clipboardData.getData('text') : '';
        const applied = applyClipboardTextToSecret(text);
        if (applied) event.preventDefault();
      });
    }

    function handleSecretInput() {
      const secretInputEl = document.getElementById('secret');
      if (!secretInputEl) return;
      const rawSecretInput = secretInputEl.value;
      if (isMixedOrUri(rawSecretInput)) return;

      const compactSecretInput = sanitizeSecretInput(rawSecretInput);
      if (rawSecretInput !== compactSecretInput) secretInputEl.value = compactSecretInput;

      if (compactSecretInput && isValidBase32(compactSecretInput) && compactSecretInput.length >= 8) {
        generateOTP();
      } else {
        setOtpValue('');
        clearMessage();
        resetCountdownUi();
        if (countdownInterval) clearInterval(countdownInterval);
        currentSecret = '';
        lastOtpTime = 0;
      }
    }
  </script>
</body>
